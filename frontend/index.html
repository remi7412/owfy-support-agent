<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Support — AI Agent</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --ink: #141413;
      --muted: #6b6a65;
      --border: #e6e4de;
      --accent-soft: #f3f2ee;
      --success: #166534;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: #fff;
      display: grid; place-items: center; font-weight: 600; font-size: 14px;
    }
    .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .status-pill {
      font-size: 11px; color: var(--success); background: #ecfdf5;
      padding: 3px 9px; border-radius: 999px; border: 1px solid #bbf7d0;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      font-size: 12.5px; padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--accent-soft); }
    .btn.active-toggle { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn-primary:hover { background: #2c2c2a; }

    main {
      flex: 1; max-width: 840px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; padding: 16px; overflow: hidden;
    }
    #chat-box {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.55; }
    .msg.user {
      align-self: flex-end; background: var(--ink); color: #fff;
      border-bottom-right-radius: 4px; white-space: pre-wrap;
    }
    .msg.assistant {
      align-self: flex-start; background: var(--surface);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .md-body p { margin-bottom: 8px; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body h1, .md-body h2, .md-body h3 { font-size: 14px; font-weight: 600; margin: 10px 0 6px; }
    .md-body ul, .md-body ol { margin: 6px 0 10px 20px; }
    .md-body li { margin-bottom: 4px; }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .md-body blockquote {
      border-left: 3px solid var(--border); padding-left: 10px;
      color: var(--muted); margin: 8px 0;
    }
    .md-body code {
      background: var(--accent-soft); padding: 1px 5px; border-radius: 4px;
      font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
    }
    .md-body pre {
      background: var(--accent-soft); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; overflow-x: auto; margin: 8px 0;
    }
    .md-body pre code { background: transparent; padding: 0; }
    .md-body table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
    .md-body th, .md-body td {
      border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top;
    }
    .md-body th { background: var(--accent-soft); font-weight: 600; }
    .md-body a { color: var(--ink); text-decoration: underline; }

    .action-card {
      margin-top: 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 13px;
    }
    .action-card-title { font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border); text-transform: uppercase;
    }

    .msg-footer {
      margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; }
    .source-tag {
      font-size: 11px; color: var(--muted); background: var(--accent-soft);
      padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border);
    }
    .feedback-btns { display: flex; gap: 4px; }
    .fb-btn {
      font-size: 11px; padding: 2px 7px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer;
    }
    .fb-btn.picked { background: var(--ink); color: #fff; border-color: var(--ink); }

    .escalate-banner {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; font-size: 12px; color: var(--muted);
    }

    .quick-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip {
      font-size: 12px; padding: 6px 11px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); cursor: pointer;
    }
    .chip:hover { background: var(--accent-soft); }

    .composer {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-end;
    }
    textarea {
      flex: 1; border: none; outline: none; resize: none;
      font-family: inherit; font-size: 14px; line-height: 1.4; max-height: 120px; padding: 4px 6px; background: transparent;
    }
    .typing { font-size: 13px; color: var(--muted); padding: 4px 8px; display: none; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(20,20,19,0.45);
      display: none; place-items: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; max-width: 440px; width: 100%; padding: 22px;
      display: flex; flex-direction: column; gap: 11px;
    }
    .modal h2 { font-size: 16px; font-weight: 600; }
    .modal label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .modal input, .modal textarea, .modal select {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; font-family: inherit; background: var(--bg);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark" id="brand-mark">O</div>
      <div><h1 id="brand-title">Owfy Support</h1></div>
      <span class="status-pill" id="mode-pill">Hybrid AI</span>
    </div>
    <div class="header-actions">
      <a class="btn" href="/">Home</a>
      <button class="btn" id="tts-btn" onclick="toggleTTS()">Voice Replies: Off</button>
      <button class="btn" onclick="openTicketModal()">Email Support</button>
      <button class="btn" onclick="resetSession()">New Chat</button>
      <a class="btn" href="/admin">Admin</a>
    </div>
  </header>

  <main>
    <div id="chat-box"></div>
    <div class="typing" id="typing">Thinking...</div>
    <div class="quick-chips" id="quick-chips"></div>

    <form class="composer" onsubmit="sendMessage(event)">
      <textarea id="input" rows="1" placeholder="Type your message..." onkeydown="handleKey(event)"></textarea>
      <button type="button" class="btn" id="mic-btn" onclick="toggleMic()" title="Voice Input (Chrome/Edge)">Mic</button>
      <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
    </form>
  </main>

  <div class="modal-backdrop" id="ticket-modal">
    <form class="modal" onsubmit="submitTicket(event)">
      <h2>Escalate to Human Support</h2>
      <p style="font-size: 13px; color: var(--muted);">We'll attach your conversation memory and email our support team.</p>
      <div><label>Your Name</label><input type="text" id="t-name" required placeholder="Alex Morgan" /></div>
      <div><label>Email Address</label><input type="email" id="t-email" required placeholder="alex@company.com" /></div>
      <div><label>Subject</label><input type="text" id="t-subject" required placeholder="Need specialist assistance" /></div>
      <div><label>Additional Notes (optional)</label><textarea id="t-summary" rows="3" placeholder="Leave blank to auto-attach chat transcript"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal('ticket-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Send Ticket</button>
      </div>
    </form>
  </div>

  <div class="modal-backdrop" id="booking-modal">
    <form class="modal" onsubmit="submitBooking(event)">
      <h2>Book a Service or Voice Callback</h2>
      <div><label>Your Name</label><input type="text" id="b-name" required placeholder="Alex Morgan" /></div>
      <div><label>Phone or Email</label><input type="text" id="b-contact" required placeholder="+974 5555 1234 or alex@company.com" /></div>
      <div>
        <label>Service / Topic</label>
        <select id="b-service">
          <option value="AI Support Consultation">AI Support Consultation</option>
          <option value="Local Service Appointment">Local Service Appointment</option>
          <option value="Custom Automation Demo">Custom Automation Demo</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div><label>Preferred Date</label><input type="date" id="b-date" required /></div>
        <div><label>Preferred Time</label><input type="time" id="b-time" required value="10:00" /></div>
      </div>
      <div>
        <label>Call Mode</label>
        <select id="b-mode">
          <option value="voice_callback">Automated / Specialist Voice Callback</option>
          <option value="video">Video Call</option>
          <option value="in_person">In-Person Visit</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal('booking-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Confirm Booking</button>
      </div>
    </form>
  </div>

  <div class="modal-backdrop" id="track-modal">
    <form class="modal" onsubmit="submitTrack(event)">
      <h2>Track Status</h2>
      <div><label>Tracking Code (e.g. OWF-1001 or IT-2045)</label><input type="text" id="tr-code" required placeholder="OWF-1001" /></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal('track-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Check Status</button>
      </div>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const paramMode = urlParams.get("mode");
    const tenantSlug = urlParams.get("tenant") || "default";
    let activeMode = ["it_support", "business_booking", "hybrid"].includes(paramMode) ? paramMode : "hybrid";

    let sessionId = localStorage.getItem("owfy_session_id");
    if (!sessionId) {
      sessionId = "sess_" + Math.random().toString(36).slice(2, 11);
      localStorage.setItem("owfy_session_id", sessionId);
    }

    let ttsEnabled = false;
    let recognition = null;

    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("input");
    const typing = document.getElementById("typing");

    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function formatInline(str) {
      return str
        .replace(/&lt;br\s*\/?&gt;/gi, "<br>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderMarkdown(raw) {
      const text = escHtml(raw.replace(/\r\n/g, "\n"));
      const codeBlocks = [];
      const withPlaceholders = text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) => {
        codeBlocks.push(`<pre><code>${code.trim()}</code></pre>`);
        return `@@CODEBLOCK_${codeBlocks.length - 1}@@`;
      });

      const lines = withPlaceholders.split("\n");
      let html = "";
      let i = 0;

      while (i < lines.length) {
        const line = lines[i].trim();
        if (!line) { i++; continue; }

        if (line.startsWith("@@CODEBLOCK_")) {
          const idx = parseInt(line.replace("@@CODEBLOCK_", "").replace("@@", ""), 10);
          html += codeBlocks[idx] || "";
          i++;
          continue;
        }

        if (/^---+$/.test(line)) {
          html += "<hr>";
          i++;
          continue;
        }

        if (line.startsWith("&gt; ")) {
          html += `<blockquote>${formatInline(line.slice(5))}</blockquote>`;
          i++;
          continue;
        }

        if (line.startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i + 1].trim())) {
          const parseRow = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => formatInline(c.trim()));
          const headers = parseRow(lines[i]);
          i += 2;
          html += "<table><thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>";
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            const cells = parseRow(lines[i]);
            html += "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
            i++;
          }
          html += "</tbody></table>";
          continue;
        }

        if (/^[-*]\s+/.test(line)) {
          html += "<ul>";
          while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
            html += `<li>${formatInline(lines[i].trim().replace(/^[-*]\s+/, ""))}</li>`;
            i++;
          }
          html += "</ul>";
          continue;
        }

        if (/^\d+\.\s+/.test(line)) {
          html += "<ol>";
          while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
            html += `<li>${formatInline(lines[i].trim().replace(/^\d+\.\s+/, ""))}</li>`;
            i++;
          }
          html += "</ol>";
          continue;
        }

        if (/^#{1,3}\s+/.test(line)) {
          html += `<h3>${formatInline(line.replace(/^#{1,3}\s+/, ""))}</h3>`;
          i++;
          continue;
        }

        html += `<p>${formatInline(line)}</p>`;
        i++;
      }

      return html;
    }

    function applyModeUI() {
      const modeMap = { hybrid: "Hybrid AI", it_support: "IT Specialist", business_booking: "Business Concierge" };
      document.getElementById("mode-pill").textContent = modeMap[activeMode] || "Hybrid AI";

      const chips = document.getElementById("quick-chips");
      if (activeMode === "it_support") {
        input.placeholder = "Describe your IT issue, error code, or paste an IT ticket (e.g. IT-2045)...";
        chips.innerHTML = `
          <button class="chip" onclick="quickPrompt('I need IT troubleshooting help with a network or VPN issue.')">Troubleshoot Network / VPN</button>
          <button class="chip" onclick="openTrackModal()">Track IT Ticket (IT-2045)</button>
          <button class="chip" onclick="openTicketModal()">Escalate to L2 Engineer</button>
        `;
      } else if (activeMode === "business_booking") {
        input.placeholder = "Ask about services, hours, booking a callback, or track an order (OWF-1001)...";
        chips.innerHTML = `
          <button class="chip" onclick="openBookingModal()">Book Appointment / Voice Call</button>
          <button class="chip" onclick="openTrackModal()">Track Order (OWF-1001)</button>
          <button class="chip" onclick="quickPrompt('What services, hours, and pricing plans do you offer?')">Services &amp; Pricing</button>
        `;
      } else {
        input.placeholder = "Ask a question, paste a tracking code (OWF-1001 / IT-2045), or book a call...";
        chips.innerHTML = `
          <button class="chip" onclick="openBookingModal()">Book Call / Service</button>
          <button class="chip" onclick="openTrackModal()">Track Order / Ticket</button>
          <button class="chip" onclick="quickPrompt('I need IT troubleshooting help with a technical issue.')">IT Troubleshooting</button>
          <button class="chip" onclick="quickPrompt('What services and pricing plans do you offer?')">Services &amp; Pricing</button>
        `;
      }
    }

    function renderActionCard(card) {
      if (!card) return null;
      const box = document.createElement("div");
      box.className = "action-card";
      if (card.type === "tracking") {
        const d = card.data;
        box.innerHTML = `
          <div class="action-card-title">
            <span>${escHtml(d.tracking_code)} — ${escHtml(d.item_title)}</span>
            <span class="badge">${escHtml(d.status.replace("_", " "))}</span>
          </div>
          <div style="color:var(--muted);">ETA: ${escHtml(d.eta)} · ${escHtml(d.last_update)}</div>
        `;
      } else if (card.type === "booking") {
        const b = card.data;
        box.innerHTML = `
          <div class="action-card-title">
            <span>Booking #${b.id} — ${escHtml(b.service_type)}</span>
            <span class="badge">${escHtml(b.status)}</span>
          </div>
          <div style="color:var(--muted);">${escHtml(b.preferred_date)} at ${escHtml(b.preferred_time)} (${escHtml(b.call_mode.replace("_", " "))})</div>
        `;
      }
      return box;
    }

    async function loadSettings() {
      const res = await fetch(`/api/public/settings?tenant=${encodeURIComponent(tenantSlug)}`);
      const data = await res.json();
      const name = data.business_name || "Owfy";
      if (!paramMode && data.agent_mode) activeMode = data.agent_mode;
      document.getElementById("brand-title").textContent = `${name} Support`;
      document.getElementById("brand-mark").textContent = name[0].toUpperCase();
      if (data.widget_color) {
        document.getElementById("brand-mark").style.background = data.widget_color;
      }
      applyModeUI();
    }

    async function loadHistory() {
      const res = await fetch(`/api/chat/history/${sessionId}`);
      const data = await res.json();
      chatBox.innerHTML = "";
      if (!data.messages.length) {
        const greetings = {
          it_support: "Hello! I'm your **IT Support Specialist**. Share your device, OS, or error message—or track an existing IT ticket like `IT-2045`.",
          business_booking: "Hello! Welcome to our **Business Concierge**. Ask about services and hours, book an appointment or voice callback, or track an order like `OWF-1001`.",
          hybrid: "Hello! I can help with **IT troubleshooting**, **service bookings & voice callbacks**, or **order/ticket tracking** (try `OWF-1001` or `IT-2045`)."
        };
        appendMessage("assistant", greetings[activeMode] || greetings.hybrid, [], false, null, false, null);
        return;
      }
      data.messages.forEach(m => appendMessage(m.role, m.content, m.sources || [], m.escalated, null, false, m.id, m.feedback));
    }

    async function sendFeedback(msgId, rating, btnEl, wrapEl) {
      await fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message_id: msgId, rating })
      });
      wrapEl.querySelectorAll(".fb-btn").forEach(b => b.classList.remove("picked"));
      btnEl.classList.add("picked");
    }

    function appendMessage(role, content, sources = [], suggestEscalation = false, actionCard = null, speak = true, msgId = null, existingFb = 0) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;

      if (role === "assistant") {
        const body = document.createElement("div");
        body.className = "md-body";
        body.innerHTML = renderMarkdown(content);
        div.appendChild(body);
        const cardEl = renderActionCard(actionCard);
        if (cardEl) div.appendChild(cardEl);
        if (speak && ttsEnabled && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(content.replace(/[*`#|]/g, "")));
        }

        if (sources.length || msgId) {
          const footer = document.createElement("div");
          footer.className = "msg-footer";
          const sWrap = document.createElement("div");
          sWrap.className = "sources";
          sources.forEach(s => {
            const tag = document.createElement("span");
            tag.className = "source-tag";
            tag.textContent = `${s.title} · ${s.category}`;
            sWrap.appendChild(tag);
          });
          footer.appendChild(sWrap);

          if (msgId) {
            const fb = document.createElement("div");
            fb.className = "feedback-btns";
            const up = document.createElement("button");
            up.className = "fb-btn" + (existingFb === 1 ? " picked" : "");
            up.textContent = "Helpful";
            up.onclick = () => sendFeedback(msgId, 1, up, fb);
            const dn = document.createElement("button");
            dn.className = "fb-btn" + (existingFb === -1 ? " picked" : "");
            dn.textContent = "Needs work";
            dn.onclick = () => sendFeedback(msgId, -1, dn, fb);
            fb.appendChild(up);
            fb.appendChild(dn);
            footer.appendChild(fb);
          }
          div.appendChild(footer);
        }
      } else {
        div.textContent = content;
      }

      if (role === "assistant" && suggestEscalation) {
        const esc = document.createElement("div");
        esc.className = "escalate-banner";
        esc.innerHTML = `<span>Need a human specialist?</span>`;
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = "Open Email Ticket";
        btn.onclick = openTicketModal;
        esc.appendChild(btn);
        div.appendChild(esc);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(e);
      }
    }

    function quickPrompt(text) {
      input.value = text;
      sendMessage(new Event("submit"));
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      appendMessage("user", text);
      typing.style.display = "block";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text, mode: activeMode, tenant_id: tenantSlug })
        });
        const data = await res.json();
        if (!res.ok) {
          appendMessage("assistant", data.detail || "Request blocked. Please try again.");
        } else {
          appendMessage("assistant", data.reply, data.sources || [], data.suggest_escalation, data.action_card, true, data.message_id);
        }
      } catch (err) {
        appendMessage("assistant", "Connection error. Please check that the FastAPI server is running.");
      } finally {
        typing.style.display = "none";
      }
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const btn = document.getElementById("tts-btn");
      btn.textContent = `Voice Replies: ${ttsEnabled ? "On" : "Off"}`;
      btn.classList.toggle("active-toggle", ttsEnabled);
      if (!ttsEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
    }

    function toggleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        appendMessage("assistant", "Voice mic input uses the browser SpeechRecognition API, which is supported in **Chrome** and **Edge** (Firefox does not enable it by default).", [], false, null, false);
        return;
      }
      const btn = document.getElementById("mic-btn");
      if (recognition) { recognition.stop(); recognition = null; btn.classList.remove("active-toggle"); return; }
      recognition = new SR();
      recognition.lang = "en-US";
      btn.classList.add("active-toggle");
      recognition.onresult = (ev) => {
        input.value = ev.results[0][0].transcript;
        btn.classList.remove("active-toggle");
        recognition = null;
      };
      recognition.onerror = () => { btn.classList.remove("active-toggle"); recognition = null; };
      recognition.onend = () => { btn.classList.remove("active-toggle"); recognition = null; };
      recognition.start();
    }

    function resetSession() {
      sessionId = "sess_" + Math.random().toString(36).slice(2, 11);
      localStorage.setItem("owfy_session_id", sessionId);
      loadHistory();
    }

    function openTicketModal() { document.getElementById("ticket-modal").style.display = "grid"; }
    function openBookingModal() {
      document.getElementById("b-date").value = new Date().toISOString().split("T")[0];
      document.getElementById("booking-modal").style.display = "grid";
    }
    function openTrackModal() { document.getElementById("track-modal").style.display = "grid"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    async function submitTicket(e) {
      e.preventDefault();
      const res = await fetch("/api/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          customer_name: document.getElementById("t-name").value,
          customer_email: document.getElementById("t-email").value,
          subject: document.getElementById("t-subject").value,
          summary: document.getElementById("t-summary").value,
          tenant_id: tenantSlug
        })
      });
      const data = await res.json();
      closeModal("ticket-modal");
      appendMessage("assistant", res.ok ? `Ticket #${data.ticket.id} created (${data.ticket.email_note}).` : (data.detail || "Could not submit ticket."));
    }

    async function submitBooking(e) {
      e.preventDefault();
      const res = await fetch("/api/bookings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          customer_name: document.getElementById("b-name").value,
          customer_contact: document.getElementById("b-contact").value,
          service_type: document.getElementById("b-service").value,
          preferred_date: document.getElementById("b-date").value,
          preferred_time: document.getElementById("b-time").value,
          call_mode: document.getElementById("b-mode").value,
          tenant_id: tenantSlug
        })
      });
      const data = await res.json();
      closeModal("booking-modal");
      if (res.ok) {
        appendMessage("assistant", "Your booking is logged! Our team will confirm shortly.", [], false, { type: "booking", data: data.booking });
      } else {
        appendMessage("assistant", data.detail || "Could not create booking.");
      }
    }

    async function submitTrack(e) {
      e.preventDefault();
      const code = document.getElementById("tr-code").value.trim();
      const res = await fetch(`/api/track/${encodeURIComponent(code)}?tenant=${encodeURIComponent(tenantSlug)}`);
      const data = await res.json();
      closeModal("track-modal");
      if (res.ok) {
        appendMessage("assistant", `Here is the latest status for **${data.item.tracking_code}**:`, [], false, { type: "tracking", data: data.item });
      } else {
        appendMessage("assistant", data.detail || "Tracking code not found.");
      }
    }

    loadSettings().then(loadHistory);
  </script>
</body>
</html>
